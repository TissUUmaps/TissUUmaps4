name: deploy
on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: development
          path: staging
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: production
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: |
            staging/pnpm-lock.yaml
            production/pnpm-lock.yaml
      - name: Build staging
        working-directory: staging
        run: pnpm install && pnpm --filter tissuumaps... run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/staging/
      - name: Build production
        working-directory: production
        run: pnpm install && pnpm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/live/
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/docs/
      - name: Prepare deployment
        run: |
          mkdir _site
          mv staging/apps/tissuumaps/dist _site/staging
          mv production/apps/tissuumaps/dist _site/live
          mv production/apps/docs/build _site/docs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
